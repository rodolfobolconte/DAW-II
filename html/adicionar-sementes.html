<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/adicionar-sementes.css" />

    <title>TRSS - Gerenciar Sementes</title>
  </head>

  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="usuario">
          <div class="avatar">👤</div>
          <span id="nomeUsuario">Olá!</span>
        </div>

        <div class="pesquisa"></div>

        <nav class="menu">
          <a href="homepage.html">
            <span class="icone">⌂</span>
            <span>Início</span>
          </a>

          <a href="monitorar-agricultores.html">
            <span class="icone">♧</span>
            <span>Monitorar agricultores</span>
          </a>

          <a href="adicionar-sementes.html" class="ativo">
            <span class="icone">▣</span>
            <span>Gerenciar sementes</span>
          </a>

          <a href="adicionar-recurso.html">
            <span class="icone">▤</span>
            <span>Gerenciar recursos</span>
          </a>

          <a href="aprovar-solicitacoes.html">
            <span class="icone">✓</span>
            <span>Aprovar solicitações</span>
          </a>

          <a href="#">
            <span class="icone">☑</span>
            <span>Avaliar devoluções</span>
          </a>

          <a href="#" class="sair" id="botaoSair">
            <span class="icone">↪</span>
            <span>Sair</span>
          </a>
        </nav>
      </aside>

      <main class="conteudo">
        <div class="conteudo-interno">
          <h1 class="titulo" id="tituloForm">Adicionar Semente</h1>

          <div class="card">
            <form id="formSemente">
              <label for="tipo">Tipo</label>
              <select id="tipo" required>
                <option value="" disabled selected>Selecione o tipo</option>
                <option value="Feijão">Feijão</option>
                <option value="Fava">Fava</option>
                <option value="Outras sementes">Outras sementes</option>
              </select>

              <label for="subtipo">Subtipo</label>
              <input type="text" id="subtipo" required />

              <label for="quantidade">Quantidade</label>
              <input
                type="number"
                id="quantidade"
                min="0"
                step="any"
                required
              />

              <div class="botoes-form">
                <button type="submit" class="enviar" id="botaoEnviar">
                  Adicionar semente
                </button>
                <button
                  type="button"
                  class="cancelar"
                  id="botaoCancelar"
                  style="display: none"
                >
                  Cancelar edição
                </button>
              </div>
            </form>

            <p id="mensagem"></p>
          </div>

          <div class="card">
            <h2 class="subtitulo">Sementes cadastradas</h2>
            <table>
              <thead>
                <tr>
                  <th>Tipo</th>
                  <th>Subtipo</th>
                  <th>Quantidade</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="listaSementes">
                <tr>
                  <td colspan="4">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script>
      const API_URL = "http://localhost:3000";

      // proteção

      const sessaoSalva = localStorage.getItem("supabase_session");
      const usuarioSalvo = localStorage.getItem("usuario");

      if (!sessaoSalva || !usuarioSalvo) {
        window.location.href = "login.html";
      }

      const usuario = JSON.parse(usuarioSalvo);

      if (usuario.papel !== "gerente") {
        window.location.href = "login.html";
      }

      document.getElementById("nomeUsuario").textContent =
        `Olá, ${usuario.nome}`;

      const sessao = JSON.parse(sessaoSalva);
      const token = sessao?.access_token;

      document
        .getElementById("botaoSair")
        .addEventListener("click", (evento) => {
          evento.preventDefault();
          localStorage.removeItem("supabase_session");
          localStorage.removeItem("usuario");
          window.location.href = "login.html";
        });

      let sementeEditando = null;

      const form = document.getElementById("formSemente");
      const mensagem = document.getElementById("mensagem");
      const botao = document.getElementById("botaoEnviar");
      const botaoCancelar = document.getElementById("botaoCancelar");
      const titulo = document.getElementById("tituloForm");

      function entrarModoEdicao(semente) {
        sementeEditando = semente.id_semente;
        document.getElementById("tipo").value = semente.tipo;
        document.getElementById("subtipo").value = semente.subtipo;
        document.getElementById("quantidade").value = semente.quantidade;

        titulo.textContent = "Editar Semente";
        botao.textContent = "Salvar alterações";
        botaoCancelar.style.display = "inline-block";

        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function sairModoEdicao() {
        sementeEditando = null;
        form.reset();
        titulo.textContent = "Adicionar Semente";
        botao.textContent = "Adicionar semente";
        botaoCancelar.style.display = "none";
      }

      botaoCancelar.addEventListener("click", sairModoEdicao);

      // carrega as sementes

      async function carregarSementes() {
        const corpoTabela = document.getElementById("listaSementes");

        try {
          const resposta = await fetch(`${API_URL}/sementes`);
          const resultado = await resposta.json();

          if (!resposta.ok || !resultado.sucesso) {
            corpoTabela.innerHTML = `<tr><td colspan="4">Erro ao carregar sementes.</td></tr>`;
            return;
          }

          if (resultado.sementes.length === 0) {
            corpoTabela.innerHTML = `<tr><td colspan="4">Nenhuma semente cadastrada ainda.</td></tr>`;
            return;
          }

          corpoTabela.innerHTML = resultado.sementes
            .map(
              (s) => `
                <tr>
                  <td>${s.tipo}</td>
                  <td>${s.subtipo}</td>
                  <td>
                    ${s.quantidade}
                    ${
                      s.quantidade === 0
                        ? `<span class="badge-zerado">Estoque zerado</span>`
                        : ""
                    }
                  </td>
                  <td class="acoes">
                    <button class="botao-editar" data-id="${s.id_semente}">Editar</button>
                    <button class="botao-excluir" data-id="${s.id_semente}">Excluir</button>
                  </td>
                </tr>
              `,
            )
            .join("");

          // Liga os botões de editar
          document.querySelectorAll(".botao-editar").forEach((btn) => {
            btn.addEventListener("click", () => {
              const semente = resultado.sementes.find(
                (s) => String(s.id_semente) === btn.dataset.id,
              );
              entrarModoEdicao(semente);
            });
          });

          // Liga os botões de excluir
          document.querySelectorAll(".botao-excluir").forEach((btn) => {
            btn.addEventListener("click", () => excluirSemente(btn.dataset.id));
          });
        } catch (erro) {
          corpoTabela.innerHTML = `<tr><td colspan="4">Não foi possível conectar com o servidor.</td></tr>`;
        }
      }

      carregarSementes();

      async function excluirSemente(id) {
        const confirmar = confirm(
          "Tem certeza que deseja excluir essa semente?",
        );
        if (!confirmar) return;

        try {
          const resposta = await fetch(`${API_URL}/sementes/${id}`, {
            method: "DELETE",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const resultado = await resposta.json();

          if (!resposta.ok) {
            alert(resultado.mensagem || "Não foi possível excluir a semente.");
            return;
          }

          carregarSementes();
        } catch (erro) {
          alert("Não foi possível conectar com o servidor.");
        }
      }

      form.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const tipo = document.getElementById("tipo").value.trim();
        const subtipo = document.getElementById("subtipo").value.trim();
        const quantidade = document.getElementById("quantidade").value;

        mensagem.textContent = "";

        if (!tipo || !subtipo || quantidade === "") {
          mensagem.textContent = "Preencha todos os campos.";
          mensagem.className = "erro";
          return;
        }

        const estaEditando = sementeEditando !== null;

        const url = estaEditando
          ? `${API_URL}/sementes/${sementeEditando}`
          : `${API_URL}/sementes`;

        const metodo = estaEditando ? "PUT" : "POST";

        botao.disabled = true;
        botao.textContent = estaEditando ? "Salvando..." : "Adicionando...";

        try {
          const resposta = await fetch(url, {
            method: metodo,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ tipo, subtipo, quantidade }),
          });

          const resultado = await resposta.json();

          if (!resposta.ok) {
            mensagem.textContent =
              resultado.mensagem ||
              (estaEditando
                ? "Não foi possível salvar as alterações."
                : "Não foi possível adicionar a semente.");
            mensagem.className = "erro";
            return;
          }

          mensagem.textContent = estaEditando
            ? "Semente atualizada com sucesso!"
            : "Semente adicionada com sucesso!";
          mensagem.className = "sucesso";

          sairModoEdicao();
          carregarSementes();
        } catch (erro) {
          mensagem.textContent = "Não foi possível conectar com o servidor.";
          mensagem.className = "erro";
        } finally {
          botao.disabled = false;
          botao.textContent = sementeEditando
            ? "Salvar alterações"
            : "Adicionar semente";
        }
      });
    </script>
  </body>
</html>
